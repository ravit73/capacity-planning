# ─────────────────────────────────────────────────────────────────────────────
# Azure DevOps Pipeline — Build & Deploy to Azure Container Apps
#
# Required setup (one-time):
#   1. Variable group "capacity-planning-vars" in Pipelines → Library
#   2. Docker Registry service connection named "acr-connection"
#      (Azure Container Registry, same ACR used by provision.sh)
#   3. Azure Resource Manager service connection named "azure-connection"
#      (Subscription scope with Contributor on the resource group)
# ─────────────────────────────────────────────────────────────────────────────

trigger:
  branches:
    include:
      - main

pr: none  # only deploy from main

variables:
  - group: capacity-planning-vars    # ACR_LOGIN_SERVER, RESOURCE_GROUP, ACA_ENVIRONMENT
  - name: backendApp
    value: capacity-backend
  - name: frontendApp
    value: capacity-frontend
  - name: imageTag
    value: $(Build.SourceVersion)    # full commit SHA

stages:

# ──────────────────────────────────────────────────────────────────────────────
# Stage 1 — Build & push Docker images
# ──────────────────────────────────────────────────────────────────────────────
- stage: Build
  displayName: Build & Push Images
  jobs:
  - job: BuildBackend
    displayName: Backend image
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build & push capacity-backend
      inputs:
        command: buildAndPush
        containerRegistry: acr-connection
        repository: capacity-backend
        dockerfile: backend/Dockerfile
        buildContext: backend
        tags: |
          $(imageTag)
          latest

  - job: BuildFrontend
    displayName: Frontend image
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build & push capacity-frontend
      inputs:
        command: buildAndPush
        containerRegistry: acr-connection
        repository: capacity-frontend
        dockerfile: frontend/Dockerfile
        buildContext: frontend
        tags: |
          $(imageTag)
          latest

# ──────────────────────────────────────────────────────────────────────────────
# Stage 2 — Deploy to Azure Container Apps
# ──────────────────────────────────────────────────────────────────────────────
- stage: Deploy
  displayName: Deploy to Azure Container Apps
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployContainerApps
    displayName: Deploy backend then frontend
    pool:
      vmImage: ubuntu-latest
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:

          # ── Backend ─────────────────────────────────────────────────────────
          - task: AzureCLI@2
            displayName: Deploy backend container app
            inputs:
              azureSubscription: azure-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az extension add --name containerapp --upgrade --only-show-errors

                az containerapp update \
                  --name $(backendApp) \
                  --resource-group $(RESOURCE_GROUP) \
                  --image $(ACR_LOGIN_SERVER)/capacity-backend:$(imageTag)

          # ── Fetch backend FQDN ───────────────────────────────────────────────
          - task: AzureCLI@2
            displayName: Get backend URL
            name: backendUrl
            inputs:
              azureSubscription: azure-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                FQDN=$(az containerapp show \
                  --name $(backendApp) \
                  --resource-group $(RESOURCE_GROUP) \
                  --query "properties.configuration.ingress.fqdn" -o tsv)
                echo "##vso[task.setvariable variable=BACKEND_URL;isOutput=true]https://${FQDN}"
                echo "Backend URL: https://${FQDN}"

          # ── Frontend ────────────────────────────────────────────────────────
          - task: AzureCLI@2
            displayName: Deploy frontend container app
            inputs:
              azureSubscription: azure-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az extension add --name containerapp --upgrade --only-show-errors

                az containerapp update \
                  --name $(frontendApp) \
                  --resource-group $(RESOURCE_GROUP) \
                  --image $(ACR_LOGIN_SERVER)/capacity-frontend:$(imageTag) \
                  --set-env-vars "BACKEND_URL=$(backendUrl.BACKEND_URL)"

          # ── Print URLs ──────────────────────────────────────────────────────
          - task: AzureCLI@2
            displayName: Print deployment URLs
            inputs:
              azureSubscription: azure-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                FRONTEND_FQDN=$(az containerapp show \
                  --name $(frontendApp) \
                  --resource-group $(RESOURCE_GROUP) \
                  --query "properties.configuration.ingress.fqdn" -o tsv)

                echo "════════════════════════════════════════"
                echo "  Frontend:  https://${FRONTEND_FQDN}"
                echo "  Backend:   $(backendUrl.BACKEND_URL)"
                echo "  API docs:  $(backendUrl.BACKEND_URL)/docs"
                echo "════════════════════════════════════════"
